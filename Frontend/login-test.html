<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Delivery Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #666;
            margin: 0;
        }
        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        .form-control {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            margin-top: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .alert {
            border-radius: 8px;
            margin-top: 15px;
        }
        .test-credentials {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9rem;
        }
        .test-credentials h6 {
            color: #495057;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .test-credential-item {
            margin: 5px 0;
            color: #666;
        }
        .test-credential-item strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2><i class="bi bi-box-arrow-in-right"></i> Login</h2>
            <p>Delivery Service Authentication</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required autocomplete="username">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required autocomplete="current-password">
            </div>

            <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
            <div id="successAlert" class="alert alert-success d-none" role="alert"></div>

            <button type="submit" class="btn btn-primary btn-login">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
        </form>

        <div class="test-credentials">
            <h6><i class="bi bi-info-circle"></i> Test Credentials</h6>
            <div class="test-credential-item"><strong>Admin:</strong> admin / password123</div>
            <div class="test-credential-item"><strong>Rider:</strong> rider1 / password123</div>
            <div class="test-credential-item"><strong>Customer:</strong> customer1 / password123</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        /*
         * UnifiedService Architecture - Login Page
         * 
         * All services are accessible through UnifiedService on port 5000.
         * Benefits: One port to manage, simpler deployment, no API Gateway needed.
         */
        const API_BASE_URL = 'http://localhost:5000/api/auth';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');

            // Hide alerts
            errorAlert.classList.add('d-none');
            successAlert.classList.add('d-none');

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                // Check if response is ok before parsing JSON
                if (!response.ok) {
                    let errorMessage = 'Login failed';
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.message || errorData.title || errorMessage;
                    } catch (e) {
                        // If response is not JSON, try to get text
                        const errorText = await response.text().catch(() => '');
                        errorMessage = errorText || response.statusText || errorMessage;
                    }
                    throw new Error(errorMessage);
                }

                const data = await response.json();

                // Store user data only (no token)
                localStorage.setItem('user', JSON.stringify(data.user));

                console.log('Login successful:', data);

                // Redirect based on role (case-insensitive comparison)
                const role = data.user.role;
                const roleLower = role.toLowerCase();
                let redirectUrl = '';

                // Determine redirect URL based on role
                if (roleLower === 'admin') {
                    redirectUrl = 'http://localhost:3003';
                } else if (roleLower === 'rider') {
                    redirectUrl = 'http://localhost:3001';
                } else if (roleLower === 'customer') {
                    redirectUrl = 'http://localhost:3002';
                } else {
                    // Unknown role, show success message
                    console.error('Unknown role:', role);
                    successAlert.innerHTML = `
                        <strong>Login Successful!</strong><br>
                        Role: ${role}<br>
                        Username: ${data.user.username}<br>
                        Email: ${data.user.email}<br>
                        <small>Unknown role. Cannot redirect.</small>
                    `;
                    successAlert.classList.remove('d-none');
                    return;
                }

                // Ensure localStorage is saved before redirect
                localStorage.setItem('user', JSON.stringify(data.user));
                
                console.log('Login successful - Role:', role, 'Redirecting to:', redirectUrl);

                // Show brief success message
                successAlert.innerHTML = `
                    <strong>✓ Login Successful!</strong><br>
                    Redirecting to ${role} App...
                `;
                successAlert.classList.remove('d-none');

                // Redirect after a brief delay to ensure token is saved and message is visible
                setTimeout(() => {
                    console.log('Redirecting to:', redirectUrl);
                    // Use location.replace to avoid back button issues
                    window.location.replace(redirectUrl);
                }, 500);

            } catch (error) {
                let errorMessage = error.message || 'An error occurred during login';
                
                // Handle network errors
                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    errorMessage = 'Cannot connect to the server. Please make sure the backend is running on http://localhost:5000';
                }
                
                errorAlert.textContent = errorMessage;
                errorAlert.classList.remove('d-none');
                console.error('Login error:', error);
            }
        });
    </script>
</body>
</html>
